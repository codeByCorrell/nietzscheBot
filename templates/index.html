<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nietzsche Chat Bot</title>
    <link rel="stylesheet" type="text/css" href="/static/style.css">
</head>
<body>
    <h1>Ask Nietzsche a question: </h1>
    <input type="text" id="user-input" class="user-input" placeholder="Your question...">
    <button id="send-button" class="send-button">Send</button>
    <p><strong>Nietzsche says:</strong> <span id="nietzsche-output">...waiting for your question</span></p>
    <script src="/static/app.js"></script>
</body>
</html>
